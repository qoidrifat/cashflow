name: E2E

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main, gh-pages]
  workflow_dispatch:

# Penting: SERIALISASI GLOBAL semua run E2E.
# Playwright workers:1 + webServer bersama + DB Turso bersama (mintSession menulis
# ke DB yang sama) → dua run paralel (mis. push ke main + PR) akan saling rebut
# server/DB dan memicu flaky (ditemukan saat investigasi flake). Jangan ubah group
# menjadi per-ref — push & PR punya ref berbeda dan bisa berjalan paralel.
concurrency:
  group: e2e
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NODE_VERSION: '20'
  VITE_AGENT_SEARCH_ENABLED: 'false'
  VITE_AI_SEARCH_ROUTE_ENABLED: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────
  # QUALITY GATES — lint, typecheck, build
  # ─────────────────────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc src)
        run: npm run lint

      - name: Typecheck E2E
        run: npm run test:e2e:typecheck

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # SECRET SCAN — Gitleaks (repo security gate)
  # ─────────────────────────────────────────────
  # Menutup gap GITHUB_READINESS (skor 98→100): secret-scan otomatis di CI.
  # Memindai SELURUH history git (fetch-depth: 0) + working tree — mendeteksi
  # leak yang sudah "dihapus" dari tree tapi masih ada di history.
  # 8 temuan known (3 key legacy AIza + 5 placeholder curl di dokumentasi)
  # di-ignore via .gitleaksignore (fingerprint commit:file:rule:line — TANPA
  # nilai secret). Jangan tambah entri .gitleaksignore tanpa persetujuan.
  # Pakai BINARY resmi (bukan gitleaks-action@v2/v3): TANPA GITLEAKS_LICENSE —
  # action resmi butuh lisensi untuk repo privat/org; binary berlaku semua repo.
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version di-pin di URL curl — Dependabot TIDAK melacak URL mentah ini,
      # jadi bump manual berkala. Cek rilis terbaru: github.com/gitleaks/gitleaks/releases
      - name: Install Gitleaks (pinned v8.30.1)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks (full history + tree)
        run: gitleaks detect --source . --no-banner --redact

  # ─────────────────────────────────────────────────────────────
  # E2E REGRESSION — Playwright, butuh Turso DB (via secrets)
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    # Skip untuk PR Dependabot: secrets Turso TIDAK di-passing ke PR dependabot
    # (selalu gagal di "Verify Turso secrets") dan banjiri concurrency group
    # global `e2e` (cancel-in-progress) sehingga membatalkan run push yang sah
    # (terbukti di run push f3d593c yang di-cancel oleh PR dependabot).
    # Pipeline penuh tetap jalan saat dependabot merge (push ke gh-pages).
    if: github.actor != 'dependabot[bot]'
    # Budget 3× suite: setup + seed + hingga 3 run suite (~3 menit/run) + contract.
    timeout-minutes: 45
    env:
      # Server API (server/index.js) membaca env ini; webServer auto-start
      # memakainya saat boot. Tanpa ini API gagal start → semua test gagal.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Opsional — hanya dibutuhkan jika spec AI di masa depan berjalan riil.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Admin email untuk gate /api/admin/metrics (resolveAdmin). CI memakai
      # DB seed terisolasi (scripts/seedE2eDataset.mjs) dengan admin seed ini.
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
      # Regression guard PINNED (e2e/helpers/fixtures.ts): CI memakai DB seed
      # terisolasi dengan dataset deterministik (284 tx / 519 gmail logs — lihat
      # konstanta di scripts/seedE2eDataset.mjs), BUKAN angka DB development
      # (541/611 yang drift). Override env ini menyelaraskan assert spec dengan
      # ground truth seed; mekanisme override didokumentasikan di fixtures.ts.
      E2E_PINNED_TRANSACTIONS_TOTAL: '284'
      E2E_PINNED_TRANSACTIONS_INCOME: '86'
      E2E_PINNED_TRANSACTIONS_EXPENSE: '131'
      E2E_PINNED_GMAIL_LOGS_TOTAL: '519'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      # server/ punya package.json sendiri dengan dep ekstra (cookie-parser,
      # @better-auth/infra, google-auth-library, @google-cloud/storage) yang TIDAK
      # ada di root package.json. webServer menjalankan node server/index.js, jadi
      # dep server wajib diinstall atau server gagal boot → seluruh suite gagal.
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset sebagai GitHub secret (diperlukan untuk boot API dan minting sesi e2e)' && exit 1

      # P4.15: CI-isolated DB seed — CI TIDAK bergantung pada DB development.
      # Seed mengisi DB Turso (secret) dengan dataset deterministik (284 tx /
      # 519 gmail logs) yang cocok dengan PINNED di e2e/helpers/fixtures.ts.
      # Idempoten + hanya menyentuh user seed. SEED_E2E=1 = safety guard:
      # mencegah eksekusi tidak sengaja terhadap DB development.
      #
      # DB CI yang baru dibuat KOSONG (no schema) → seed gagal "no such table:
      # user" (terbukti di run CI #2). Apply turso-schema.sql dulu: IDEMPOTEN
      # (CREATE TABLE/INDEX IF NOT EXISTS + ALTER di-ignore bila kolom sudah
      # ada) → aman di tiap run & terhadap DB apa pun.
      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      - name: Seed E2E dataset (CI-isolated DB)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      # Stability gate 3× (roadmap CI_PIPELINE.md #1 — diterapkan saat suite > 20
      # test; kini 38 test). scripts/e2e-stability-gate.sh menjalankan suite hingga
      # 3 attempt dan GAGAL HANYA bila 3× gagal berturut (regresi riil). Flake
      # sesekali (1-2 attempt gagal lalu lulus) = job HIJAU + ::warning:: + arsip
      # per-attempt untuk forensik. Playwright retries:1 menangani flake per-test.
      # Re-seed antar attempt gagal (idempoten, SEED_E2E=1) memastikan attempt
      # berikutnya mulai dari state deterministik.
      - name: Run E2E suite — stability gate (3×, fail only on 3× flaky)
        id: e2e-gate
        run: bash scripts/e2e-stability-gate.sh
        env:
          SEED_E2E: '1'
          MAX_ATTEMPTS: '3'

      - name: Run API contract tests (schema drift detection)
        run: npm run test:e2e:contract

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Arsip per-attempt (flake forensics): report + traces dari SETIAP attempt
      # yang GAGAL — termasuk attempt yang lalu sukses di retry (flake yang lolos
      # gate). Dipakai untuk menyelidiki mengapa sebuah test flaky.
      - name: Upload stability-gate per-attempt artifacts (flake forensics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-attempt-artifacts
          path: |
            playwright-report-attempt-*/
            test-results-attempt-*/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts — traces · screenshots · videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # VISUAL REGRESSION — Playwright snapshot (dark/light, desktop/mobile)
  # ─────────────────────────────────────────────────────────────
  # Roadmap CI_PIPELINE.md #4 (VISUAL_REGRESSION_PLAN.md). Baseline di-commit
  # (e2e/visual/visual-regression.spec.ts-snapshots/, TANPA suffix platform via
  # snapshotPathTemplate) → portabel lintas OS. Font Manrope/Outfit SELF-HOSTED
  # di public/fonts/ (lihat globals.css) agar rendering identik Windows vs Ubuntu.
  #
  # needs: [quality, e2e] — SERIAL, bukan paralel: suite berbagi DB Turso
  # (mintSession/cleanup) + webServer port 5180/5181. Menjalankan 2 instance
  # Playwright paralel pada DB yang sama = race session (aturan proyek).
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    # Skip untuk PR Dependabot (alasan sama dengan e2e): butuh secrets Turso.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset sebagai GitHub secret (visual spec minting sesi e2e)' && exit 1

      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      - name: Seed E2E dataset (CI-isolated DB, idempoten)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      # Check mode (tanpa --update-snapshots): bandingkan render vs baseline.
      - name: Run visual regression check
        run: npm run test:e2e:visual:check

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 14

      # Diff screenshot (actual vs baseline) untuk debugging visual — hanya saat gagal.
      - name: Upload screenshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            e2e/visual/visual-regression.spec.ts-snapshots/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # PERFORMANCE BUDGET — page load, API latency, pagination
  # ─────────────────────────────────────────────────────────────
  # Roadmap CI_PIPELINE.md #7 (PERFORMANCE_TEST_PLAN.md). Budget dev (default di
  # e2e/performance/performance.config.ts) longgar untuk dev build; di CI di-override
  # dengan angka terkalibrasi dari perf-reports nyata (v2, 2026-08-03 — lihat env job).
  # Pagination: SOFT = warning (report-only), HARD = fail.
  #
  # needs: [quality, e2e, visual-regression] — SERIAL penuh (alasan sama di atas).
  performance:
    name: Performance Budget
    runs-on: ubuntu-latest
    needs: [quality, e2e, visual-regression]
    # Skip untuk PR Dependabot (alasan sama dengan e2e): butuh secrets Turso.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
      # Kalibrasi CI v2 (2026-08-03 — berbasis perf-reports nyata, bukan tebakan).
      # Terukur (dev, 3 sampel): DOM ≤261ms · LOAD ≤277ms · API p95 ≤549ms ·
      # requests 41/page (deterministik) · pagination 3.0–5.1s (dev React + Turso remote).
      # Budget = terukur × margin ~3–15×: runner shared ubuntu lebih lambat dari dev
      # lokal (margin menyerap noise mesin), tapi tetap menangkap regresi orde-magnitudo
      # (bundle bloat, N+1, index hilang). API p95 1800 (bukan 1500): dengan n=3 sampel,
      # p95 = maks dari 3 → margin 3.3× menyerap spike cold-TLS/GC di runner shared
      # tanpa false-fail. Tighten berikutnya dari trend artifact perf-reports.
      PERF_BUDGET_PAGE_LOAD_MS: '3000'
      PERF_BUDGET_LOAD_MS: '4000'
      PERF_BUDGET_API_P95_MS: '1800'
      PERF_BUDGET_MAX_REQUESTS: '60'
      PERF_BUDGET_PAGINATION_SOFT_MS: '6000'
      PERF_BUDGET_PAGINATION_HARD_MS: '12000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset sebagai GitHub secret (perf spec minting sesi e2e)' && exit 1

      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      - name: Seed E2E dataset (CI-isolated DB, idempoten)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      - name: Run performance budget
        run: npm run test:e2e:perf

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-perf
          path: playwright-report/
          retention-days: 14

      # Perf report JSON (test-results/perf/perf-*.json) → trend historis.
      - name: Upload perf report JSON (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: test-results/perf/
          if-no-files-found: ignore
          retention-days: 30
