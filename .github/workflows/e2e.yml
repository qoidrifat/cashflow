name: E2E

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main, gh-pages]
  workflow_dispatch:

# Penting: SERIALISASI GLOBAL semua run E2E yang menyentuh DB/server.
# Playwright workers:1 + webServer bersama + DB Turso bersama (mintSession menulis
# ke DB yang sama) → dua run paralel (mis. push ke main + PR) akan saling rebut
# server/DB dan memicu flaky (ditemukan saat investigasi flake). Jangan ubah group
# menjadi per-ref — push & PR punya ref berbeda dan bisa berjalan paralel.
#
# Pengecualian TERPISAH: run dependabot[bot]. Job e2e/visual/perf di-skip untuk
# dependabot (if: github.actor != dependabot[bot]) sehingga run dependabot HANYA
# menjalankan quality + gitleaks — TIDAK menyentuh DB Turso / webServer Playwright.
# Sebelum ini, run dependabot masuk group `e2e` yang sama → cancel-in-progress
# membatalkan run push yang sah (terbukti run f91fb9a di-cancel PR dependabot
# 30934765113). Group terpisah untuk dependabot = aman (tanpa akses resource E2E)
# dan push/PR normal tetap terserialisasi global.
concurrency:
  # Hanya DUA nilai: 'dependabot' (terisolasi) vs 'normal' (semua run lain).
  # JANGAN pakai github.ref di sini — push & PR normal punya ref berbeda dan bisa
  # berjalan paralel, padahal keduanya menyentuh DB Turso yang sama (aturan di atas).
  group: e2e-${{ github.actor == 'dependabot[bot]' && 'dependabot' || 'normal' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  # Node 20 EOL (Apr 2026) & runner default kini Node 24 — bump 20 → 24
  # (2026-08-05, audit CI): seluruh toolchain (Vite 5+, Playwright, vitest,
  # better-auth, @libsql) terverifikasi jalan di Node 24 (dev lokal v24.15.0;
  # full stack validation lulus). Setup Node action v5 menargetkan node24.
  NODE_VERSION: '24'
  VITE_AGENT_SEARCH_ENABLED: 'false'
  VITE_AI_SEARCH_ROUTE_ENABLED: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────
  # QUALITY GATES — lint, typecheck, build
  # ─────────────────────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests meng-import server modules (gmailRoutes → authMiddleware →
      # auth.js → @better-auth/infra; agentSearch → google-auth-library /
      # @google-cloud/storage) yang hanya ada di server/package.json, BUKAN root.
      # Tanpa install server deps, `npm run test:unit` gagal di CI fresh install
      # (locally lolos karena server/node_modules ter-hoist dari install e2e
      # sebelumnya — verifikasi reviewer Phase-1 2026-08-04).
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      # P2.4 — tiered dependency audit: CRITICAL / HIGH-production = blocking,
      # HIGH-dev / MODERATE / LOW = warning. Exception terdokumentasi di
      # scripts/dependency-audit.exceptions.json (review date). Jangan pernah
      # `npm audit fix --force` otomatis di CI.
      - name: Dependency audit (tiered gate)
        run: npm run audit:deps

      - name: Lint (tsc src)
        run: npm run lint

      - name: Typecheck E2E
        run: npm run test:e2e:typecheck

      # Unit tests (vitest) — pure logic, TANPA secrets/Turso → bisa jalan di
      # quality job tanpa DB. Audit Phase-1 (2026-08-04) menemukan 8 test G3
      # gagal (mock state leak) yang TIDAK terdeteksi karena test:unit tidak
      # pernah dijalankan CI. Gate ini menutup gap tersebut: regresi unit test
      # kini memblokir merge sebelum e2e (needs: quality).
      - name: Unit tests (vitest)
        run: npm run test:unit

      # P0.4 Schema Drift Guard — tanpa kredensial Turso: mode LOCAL membuat
      # temp DB, apply SEMUA migration, verifikasi kontrak (tabel/kolom/index
      # kritis + baseline sync turso-schema.sql ↔ 0001_baseline.sql).
      # Missing table/column/index, checksum drift, duplicate version → exit 1.
      - name: Schema drift guard (db:migrate:check)
        run: npm run db:migrate:check

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # SECRET SCAN — Gitleaks (repo security gate)
  # ─────────────────────────────────────────────
  # Menutup gap GITHUB_READINESS (skor 98→100): secret-scan otomatis di CI.
  # Memindai SELURUH history git (fetch-depth: 0) + working tree — mendeteksi
  # leak yang sudah "dihapus" dari tree tapi masih ada di history.
  # 8 temuan known (3 key legacy AIza + 5 placeholder curl di dokumentasi)
  # di-ignore via .gitleaksignore (fingerprint commit:file:rule:line — TANPA
  # nilai secret). Jangan tambah entri .gitleaksignore tanpa persetujuan.
  # Pakai BINARY resmi (bukan gitleaks-action@v2/v3): TANPA GITLEAKS_LICENSE —
  # action resmi butuh lisensi untuk repo privat/org; binary berlaku semua repo.
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version di-pin di URL curl — Dependabot TIDAK melacak URL mentah ini,
      # jadi bump manual berkala. Cek rilis terbaru: github.com/gitleaks/gitleaks/releases
      - name: Install Gitleaks (pinned v8.30.1)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks (full history + tree)
        run: gitleaks detect --source . --no-banner --redact

  # ─────────────────────────────────────────────────────────────
  # E2E REGRESSION — Playwright, butuh Turso DB (via secrets)
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    # Skip untuk PR Dependabot: secrets Turso TIDAK di-passing ke PR dependabot
    # (selalu gagal di "Verify Turso secrets") dan banjiri concurrency group
    # global `e2e` (cancel-in-progress) sehingga membatalkan run push yang sah
    # (terbukti di run push f3d593c yang di-cancel oleh PR dependabot).
    # Pipeline penuh tetap jalan saat dependabot merge (push ke gh-pages).
    if: github.actor != 'dependabot[bot]'
    # Budget 3× suite: setup + seed + hingga 3 run suite (~3 menit/run)
    # + panel rekomendasi (P10.2j, ~1 menit) + contract.
    timeout-minutes: 45
    env:
      # Server API (server/index.js) membaca env ini; webServer auto-start
      # memakainya saat boot. Tanpa ini API gagal start → semua test gagal.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Opsional — hanya dibutuhkan jika spec AI di masa depan berjalan riil.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Admin email untuk gate /api/admin/metrics (resolveAdmin). CI memakai
      # DB seed terisolasi (scripts/seedE2eDataset.mjs) dengan admin seed ini.
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
      # Regression guard PINNED (e2e/helpers/fixtures.ts): CI memakai DB seed
      # terisolasi dengan dataset deterministik (284 tx / 519 gmail logs — lihat
      # konstanta di scripts/seedE2eDataset.mjs), BUKAN angka DB development
      # (541/611 yang drift). Override env ini menyelaraskan assert spec dengan
      # ground truth seed; mekanisme override didokumentasikan di fixtures.ts.
      E2E_PINNED_TRANSACTIONS_TOTAL: '284'
      E2E_PINNED_TRANSACTIONS_INCOME: '86'
      E2E_PINNED_TRANSACTIONS_EXPENSE: '131'
      E2E_PINNED_GMAIL_LOGS_TOTAL: '519'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      # server/ punya package.json sendiri dengan dep ekstra (cookie-parser,
      # @better-auth/infra, google-auth-library, @google-cloud/storage) yang TIDAK
      # ada di root package.json. webServer menjalankan node server/index.js, jadi
      # dep server wajib diinstall atau server gagal boot → seluruh suite gagal.
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      # Cache binary browser Playwright (~/.cache/ms-playwright) antar job
      # (e2e → visual → perf) — hindari download ulang ~1-2 menit per job.
      # Key berbasis hash package-lock (root) → invalidate otomatis saat versi
      # Playwright berubah. Aman: bila cache miss/corrupt, install tetap jalan.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset sebagai GitHub secret (diperlukan untuk boot API dan minting sesi e2e)' && exit 1

      # P4.15: CI-isolated DB seed — CI TIDAK bergantung pada DB development.
      # Seed mengisi DB Turso (secret) dengan dataset deterministik (284 tx /
      # 519 gmail logs) yang cocok dengan PINNED di e2e/helpers/fixtures.ts.
      # Idempoten + hanya menyentuh user seed. SEED_E2E=1 = safety guard:
      # mencegah eksekusi tidak sengaja terhadap DB development.
      #
      # DB CI yang baru dibuat KOSONG (no schema) → seed gagal "no such table:
      # user" (terbukti di run CI #2). Apply turso-schema.sql dulu: IDEMPOTEN
      # (CREATE TABLE/INDEX IF NOT EXISTS + ALTER di-ignore bila kolom sudah
      # ada) → aman di tiap run & terhadap DB apa pun.
      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      # P0.1: migrasi DB CI ke state versioned terbaru (baseline + 0002+).
      # Additive-only (CREATE IF NOT EXISTS + ALTER ADD COLUMN baru) — aman
      # dijalankan ulang; mendeteksi checksum drift lebih awal.
      - name: Run DB migrations (CI DB, versioned)
        run: npm run db:migrate

      - name: Seed E2E dataset (CI-isolated DB)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      # Stability gate 3× (roadmap CI_PIPELINE.md #1 — diterapkan saat suite > 20
      # test; kini 71 test — dihitung via `playwright test --list` 2026-08-08,
      # incl. admin-monitoring-recommendation.spec.ts). Seluruh spec di e2e/ ikut
      # suite ini via auto-discovery (testDir: './e2e' + --grep-invert @visual|@perf)
      # — primary gate: setiap regresi spec (incl. panel Rekomendasi AI) terblokir
      # di sini. Step per-spec lain TIDAK ada (npm scripts test:e2e:* umumnya untuk
      # debugging lokal; mis. test:e2e:monitoring-chart) KECUALI satu: step
      # `test:e2e:recommendation-panel` ditambahkan P10.2j sebagai sinyal kegagalan
      # eksplisit — redundan dengan full suite, disengaja (lihat step di bawah).
      # scripts/e2e-stability-gate.sh menjalankan suite hingga
      # 3 attempt dan GAGAL HANYA bila 3× gagal berturut (regresi riil). Flake
      # sesekali (1-2 attempt gagal lalu lulus) = job HIJAU + ::warning:: + arsip
      # per-attempt untuk forensik. Playwright retries:1 menangani flake per-test.
      # Re-seed antar attempt gagal (idempoten, SEED_E2E=1) memastikan attempt
      # berikutnya mulai dari state deterministik.
      - name: Run E2E suite — stability gate (3×, fail only on 3× flaky)
        id: e2e-gate
        run: bash scripts/e2e-stability-gate.sh
        env:
          SEED_E2E: '1'
          MAX_ATTEMPTS: '3'

      # P10.2j: sinyal kegagalan EKSPLISIT panel Rekomendasi AI. Spec
      # admin-monitoring-recommendation.spec.ts dijalankan LAGI sebagai step
      # terpisah SETELAH stability gate — REDUNDAN dengan full suite di atas
      # (auto-discovery), disengaja atas permintaan produk: bila panel ini
      # regresi, kegagalannya terlihat langsung sebagai step bernama di run,
      # bukan terkubur di suite 71 test. Spec men-seed data sintetisnya sendiri
      # (prefiks e2e-reco-*, dibersihkan di afterAll) → tidak mengubah state
      # deterministik step lain. Playwright retries:1 menangani flake per-test.
      - name: E2E — panel Rekomendasi AI (explicit signal, P10.2j)
        run: npm run test:e2e:recommendation-panel

      - name: Run API contract tests (schema drift detection)
        run: npm run test:e2e:contract

      # Drift guard namespace /api/ai-product/* (track/feedback/memory/timeline/
      # conversation) — spec terpisah (e2e/contract/ai-product.spec.ts) agar
      # kegagalan kontrak AI product terlihat sebagai step bernama (pola
      # P10.2j explicit signal). Self-cleaning: seluruh side-effect ditandai
      # marker 'e2e-ai-contract-' dan dibersihkan di afterAll.
      - name: Run AI-product API contract tests (drift guard)
        run: npm run test:e2e:contract:ai-product

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Arsip per-attempt (flake forensics): report + traces dari SETIAP attempt
      # yang GAGAL — termasuk attempt yang lalu sukses di retry (flake yang lolos
      # gate). Dipakai untuk menyelidiki mengapa sebuah test flaky.
      - name: Upload stability-gate per-attempt artifacts (flake forensics)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stability-attempt-artifacts
          path: |
            playwright-report-attempt-*/
            test-results-attempt-*/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts — traces · screenshots · videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # E2E TERISOLASI — DB libSQL LOKAL per run (P1.7), TANPA secrets Turso
  # ─────────────────────────────────────────────────────────────
  # Config playwright.e2e-local.config.mjs: webServer chain menyiapkan DB lokal
  # fresh per run (.test-data/e2e-local.db — delete-first, schema+migrasi+seed
  # deterministik CI 284tx/519logs) lalu boot API (port 5191) + Vite (5190).
  # GEMINI_MOCK=1 → spec AI deterministik offline (boundary mock P1.8).
  #
  # KEUNGGULAN: job ini TIDAK menyentuh Turso (file: URL) → bisa jalan untuk
  # PR dependabot (tanpa secrets) dan paralel dengan e2e (port & DB berbeda;
  # concurrency group tetap serialisasi workflow-level, bukan resource-level).
  # Spec yang butuh server khusus (rate-limit 5182, webhook 5183/5184) dan
  # @visual/@perf di-ignore di config — mereka tetap punya guard di job lain.
  e2e-isolated:
    name: E2E Isolated DB (local SQLite)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      # webServer menjalankan node server/index.js — dep server wajib (pola job e2e).
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Suite fungsional penuh terhadap DB lokal fresh — tanpa step seed terpisah
      # (config menyiapkan DB sebelum API boot). Guard produksi: script menolak
      # URL non-file: (E2E tidak pernah menulis ke DB remote dari sini).
      - name: Run E2E suite (isolated local DB)
        run: npm run test:e2e:isolated

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-isolated
          path: playwright-report-local/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-isolated
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # E2E PARALLEL — per-worker DB isolation (P2.2), runs parallel with e2e
  # ─────────────────────────────────────────────────────────────
  # npm run test:e2e:parallel = scripts/run-e2e-shards.mjs: N process shard
  # berjalan KONKUREN, masing-masing worker memakai DB file sendiri
  # (.test-data/e2e-shard-<i>.db) + port sendiri (5190+2i/5191+2i) + slice test
  # sendiri (--shard=i/N). TANPA secret Turso — DB lokal file: (guard menolak
  # URL non-file). E2E_SHARDS=4 di CI (runner lebih besar dari dev laptop;
  # di dev default 2 — lihat benchmark di docs/ci/TESTING_STRATEGY.md P2).
  e2e-parallel:
    name: E2E Parallel (per-worker DB)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (parallel shards, per-worker isolated DBs)
        run: E2E_SHARDS=4 npm run test:e2e:parallel

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-parallel
          path: playwright-report-local/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-parallel
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # ACCESSIBILITY — Axe core pages (P2.1), serial setelah e2e (shared DB)
  # ─────────────────────────────────────────────────────────────
  # e2e/accessibility.spec.ts: scan axe core pages (/dashboard, /transactions,
  # /ai, /ai/timeline, /admin/monitoring) LIGHT + DARK dengan auth sesi nyata
  # (mintSession / admin = ADMIN_EMAILS[0]). Gate (P2.1): 0 violation SERIOUS
  # ke atas (color-contrast = 0 di kedua tema — design-token pass + opacity
  # scale fix). needs: [quality, e2e] — SERIAL (DB Turso bersama + port
  # 5180/5181; jangan paralelkan dengan job yang menulis DB).
  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset (a11y spec minting sesi e2e)' && exit 1

      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      - name: Run DB migrations (CI DB, versioned)
        run: npm run db:migrate

      - name: Seed E2E dataset (CI-isolated DB, idempoten)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      # Gate: 0 violation CRITICAL di 5 halaman inti (admin memakai sesi admin).
      - name: Run accessibility scan (axe, critical gate)
        run: npm run test:a11y

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-a11y
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-a11y
          path: test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # VISUAL REGRESSION — Playwright snapshot (dark/light, desktop/mobile)
  # ─────────────────────────────────────────────────────────────
  # Roadmap CI_PIPELINE.md #4 (VISUAL_REGRESSION_PLAN.md). Baseline di-commit
  # (e2e/visual/visual-regression.spec.ts-snapshots/, TANPA suffix platform via
  # snapshotPathTemplate) → portabel lintas OS. Font Manrope/Outfit SELF-HOSTED
  # di public/fonts/ (lihat globals.css) agar rendering identik Windows vs Ubuntu.
  #
  # needs: [quality, e2e] — SERIAL, bukan paralel: suite berbagi DB Turso
  # (mintSession/cleanup) + webServer port 5180/5181. Menjalankan 2 instance
  # Playwright paralel pada DB yang sama = race session (aturan proyek).
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    # Skip untuk PR Dependabot (alasan sama dengan e2e): butuh secrets Turso.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      # Cache binary browser Playwright (~/.cache/ms-playwright) antar job
      # (e2e → visual → perf) — hindari download ulang ~1-2 menit per job.
      # Key berbasis hash package-lock (root) → invalidate otomatis saat versi
      # Playwright berubah. Aman: bila cache miss/corrupt, install tetap jalan.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset sebagai GitHub secret (visual spec minting sesi e2e)' && exit 1

      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      - name: Run DB migrations (CI DB, versioned)
        run: npm run db:migrate

      - name: Seed E2E dataset (CI-isolated DB, idempoten)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      # Check mode (tanpa --update-snapshots): bandingkan render vs baseline.
      - name: Run visual regression check
        run: npm run test:e2e:visual:check

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 14

      # Diff screenshot (actual vs baseline) untuk debugging visual — hanya saat gagal.
      - name: Upload screenshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: |
            test-results/
            e2e/visual/visual-regression.spec.ts-snapshots/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # PERFORMANCE BUDGET — page load, API latency, pagination
  # ─────────────────────────────────────────────────────────────
  # Roadmap CI_PIPELINE.md #7 (PERFORMANCE_TEST_PLAN.md). Budget dev (default di
  # e2e/performance/performance.config.ts) longgar untuk dev build; di CI di-override
  # dengan angka terkalibrasi dari perf-reports nyata (v2, 2026-08-03 — lihat env job).
  # Pagination: SOFT = warning (report-only), HARD = fail.
  #
  # needs: [quality, e2e, visual-regression] — SERIAL penuh (alasan sama di atas).
  performance:
    name: Performance Budget
    runs-on: ubuntu-latest
    needs: [quality, e2e, visual-regression]
    # Skip untuk PR Dependabot (alasan sama dengan e2e): butuh secrets Turso.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'e2e-seed-admin@cashflow.test' }}
      # Kalibrasi CI v2 (2026-08-03 — berbasis perf-reports nyata, bukan tebakan).
      # Terukur (dev, 3 sampel): DOM ≤261ms · LOAD ≤277ms · API p95 ≤549ms ·
      # requests 41–65 unique/page (Vite DEV mode = 1 request/modul ESM, fluktuasi
      # module graph + HMR revalidate `?t=` — teramati CI #26/#27 2026-08-05:
      # dashboard 63, transactions 61-65, vs lokal 41 saat idle) · pagination
      # 3.0–5.1s (dev React + Turso remote).
      # Budget = terukur × margin ~3–15×: runner shared ubuntu lebih lambat dari dev
      # lokal (margin menyerap noise mesin), tapi tetap menangkap regresi orde-magnitudo
      # (bundle bloat, N+1, index hilang). API p95 1800 (bukan 1500): dengan n=3 sampel,
      # p95 = maks dari 3 → margin 3.3× menyerap spike cold-TLS/GC di runner shared
      # tanpa false-fail. Tighten berikutnya dari trend artifact perf-reports.
      PERF_BUDGET_PAGE_LOAD_MS: '3000'
      PERF_BUDGET_LOAD_MS: '4000'
      PERF_BUDGET_API_P95_MS: '1800'
      # 60 → 80 (2026-08-05): budget 60 terbukti flaky struktural di dev mode —
      # request unik/page teramati 41–65 (Vite unbundled ESM, 1 request/modul;
      # module graph & HMR revalidate bervariasi di runner shared). 80 = default
      # dev & margin ~25% dari puncak 65; masih mendeteksi bundle bloat
      # orde-magnitudo (chunk/asset baru menambah puluhan URL unik). Measurement
      # diperbaiki paralel: dedup URL + strip query `?t=` + exclude ws/@react-refresh.
      PERF_BUDGET_MAX_REQUESTS: '80'
      PERF_BUDGET_PAGINATION_SOFT_MS: '6000'
      PERF_BUDGET_PAGINATION_HARD_MS: '12000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      # Cache binary browser Playwright (~/.cache/ms-playwright) antar job
      # (e2e → visual → perf) — hindari download ulang ~1-2 menit per job.
      # Key berbasis hash package-lock (root) → invalidate otomatis saat versi
      # Playwright berubah. Aman: bila cache miss/corrupt, install tetap jalan.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Turso secrets
        if: env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == ''
        run: echo '::error::TURSO_DATABASE_URL dan TURSO_AUTH_TOKEN wajib diset sebagai GitHub secret (perf spec minting sesi e2e)' && exit 1

      - name: Apply Turso schema (CI DB, idempoten)
        run: node scripts/applyTursoSchema.mjs

      - name: Run DB migrations (CI DB, versioned)
        run: npm run db:migrate

      - name: Seed E2E dataset (CI-isolated DB, idempoten)
        run: node scripts/seedE2eDataset.mjs
        env:
          SEED_E2E: '1'

      # Stability gate 3× (pola sama dengan e2e job): runner shared + Turso
      # remote rawan cold-start flaky — teramati run #26 (2026-08-05): raw
      # request-count 63 > 60 di /dashboard (retry-inflation fetch — diperbaiki
      # via dedup URL di measurePageTiming) dan cold DOM/LOAD di attempt 1 saat
      # uji lokal. Gate menoleransi flake sesekali (hijau + warning + arsip),
      # tapi 3× gagal berturut = regresi riil (merah). Budget TIDAK dilemahkan.
      - name: Run performance budget — stability gate (3×, fail only on 3× flaky)
        run: bash scripts/e2e-stability-gate.sh
        env:
          E2E_CMD: 'npm run test:e2e:perf'
          MAX_ATTEMPTS: '3'

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-perf
          path: playwright-report/
          retention-days: 14

      # Perf report JSON (test-results/perf/perf-*.json) → trend historis.
      - name: Upload perf report JSON (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-reports
          path: test-results/perf/
          if-no-files-found: ignore
          retention-days: 30
